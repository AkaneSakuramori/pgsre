<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-label="Artifact size breakdown">
  <defs>
    <linearGradient id="b1" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff8a3d"/><stop offset="1" stop-color="#ffb37a"/></linearGradient>
    <linearGradient id="b2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5aa9ff"/><stop offset="1" stop-color="#8cc4ff"/></linearGradient>
    <linearGradient id="b3" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#39d3c3"/><stop offset="1" stop-color="#7de6da"/></linearGradient>
    <linearGradient id="b4" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#c4b5fd"/></linearGradient>
    <linearGradient id="b5" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f472b6"/><stop offset="1" stop-color="#f9a8d4"/></linearGradient>
    <linearGradient id="b6" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#facc15"/><stop offset="1" stop-color="#fde68a"/></linearGradient>
  </defs>

  <rect width="1000" height="420" fill="#0b1118"/>
  <text x="40" y="48" fill="#f2f6fb" font-family="ui-monospace, monospace" font-size="20" font-weight="700">Decoded artifact size by class</text>
  <text x="40" y="72" fill="#7d8da3" font-family="ui-monospace, monospace" font-size="12">approximate; native libs are compiled binaries, not source</text>

  <g font-family="ui-monospace, monospace" font-size="13">
    <!-- max width 700 px maps to 367.4 MB -->
    <!-- C/C++ -->
    <text x="40" y="118" fill="#b9c7d8">C / C++ (.so)</text>
    <rect x="220" y="103" width="700" height="22" rx="4" fill="url(#b1)"/>
    <text x="934" y="119" fill="#f2f6fb">367.4 MB</text>

    <text x="40" y="158" fill="#b9c7d8">Smali</text>
    <rect x="220" y="143" width="383" height="22" rx="4" fill="url(#b2)"/>
    <text x="617" y="159" fill="#f2f6fb">200.9 MB</text>

    <text x="40" y="198" fill="#b9c7d8">Assets</text>
    <rect x="220" y="183" width="318" height="22" rx="4" fill="url(#b3)"/>
    <text x="552" y="199" fill="#f2f6fb">166.7 MB</text>

    <text x="40" y="238" fill="#b9c7d8">Java</text>
    <rect x="220" y="223" width="68" height="22" rx="4" fill="url(#b4)"/>
    <text x="302" y="239" fill="#f2f6fb">35.7 MB</text>

    <text x="40" y="278" fill="#b9c7d8">DEX</text>
    <rect x="220" y="263" width="53" height="22" rx="4" fill="url(#b5)"/>
    <text x="287" y="279" fill="#f2f6fb">28.0 MB</text>

    <text x="40" y="318" fill="#b9c7d8">Resources</text>
    <rect x="220" y="303" width="10" height="22" rx="4" fill="url(#b6)"/>
    <text x="244" y="319" fill="#f2f6fb">5.4 MB</text>
  </g>

  <g font-family="ui-monospace, monospace" font-size="11" fill="#5f7188">
    <line x1="220" y1="360" x2="920" y2="360" stroke="#26394d"/>
    <text x="220" y="380">0</text>
    <text x="560" y="380">184 MB</text>
    <text x="900" y="380">367 MB</text>
  </g>
</svg>
